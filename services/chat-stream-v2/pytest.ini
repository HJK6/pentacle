[pytest]
timeout = 60
timeout_method = thread
testpaths = tests
# The soak tier runs for minutes and is opt-in: a bare `pytest` (and the smoke
# gate) skip it; run it with `-m soak`. Its own per-test timeout is set on the
# test (the 60s global would kill a multi-minute soak).
# Quarantined cases run through the v2-quarantined target.
addopts = -m "not soak and not quarantined"
markers =
    soak: long-running soak tier (minutes); opt in with `-m soak`

    repin_exhaustive: complete Addendum B matrix; run separately with the supported focused runner (FD budget 2400s)
    quarantined: confirmed flaky test with an open disposition; runs in the advisory step
