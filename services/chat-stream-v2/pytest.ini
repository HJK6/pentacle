[pytest]
timeout = 60
timeout_method = thread
testpaths = tests
# The soak tier runs for minutes and is opt-in: a bare `pytest` (and the smoke
# gate) skip it; run it with `-m soak`. Its own per-test timeout is set on the
# test (the 60s global would kill a multi-minute soak).
addopts = -m "not soak"
markers =
    soak: long-running soak tier (minutes); opt in with `-m soak`
