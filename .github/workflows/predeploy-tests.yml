name: Disposable merge control
on:
  pull_request:
    branches: [combined-control-1793099576-base]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - run: |
        mode=$(cat .merge-control-mode)
        if [ "$mode" = red ]; then exit 1; fi
        if [ "$mode" = wait ]; then sleep 180; fi
  web:
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  daemon:
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  contracts:
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
