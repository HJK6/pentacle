name: Disposable merge control
on:
  pull_request:
    branches: [combined-skip-repair-1793100099-base]
permissions:
  contents: read
jobs:
  frontend:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - run: |
        mode=$(cat .merge-control-mode)
        if [ "$mode" = red ]; then exit 1; fi
        if [ "$mode" = wait ]; then sleep 180; fi
  web:
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  daemon:
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  contracts:
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  checks:
    needs: [frontend, web, daemon, contracts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - env:
        CI_REQUIRED_NEEDS: ${{ toJSON(needs) }}
      run: python3 scripts/ci_required_aggregate.py
