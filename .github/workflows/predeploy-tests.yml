    - name: Source integrity after setup
      run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
    - name: Daemon merge checks
      run: |
        umask 077
        python3 scripts/gate_env.py run --profile pentacle --workspace "${RUNNER_TEMP}/gate-env/${GITHUB_JOB}" --evidence-dir "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/daemon" --target v2-merge-ci --spec ci-public-checks --series "ci-${GITHUB_RUN_ID}-daemon" --purpose acceptance --attempt-manifest "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/attempt-manifest.json"
    - name: Source integrity at gate end
      run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
      if: ${{ always() }}
    - name: Retain gate summaries
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: gate-summaries-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
