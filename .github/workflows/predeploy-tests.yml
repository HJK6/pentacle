    - frontend
    - web
    - daemon
    - contracts
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Require every partition to succeed
      env:
        CI_REQUIRED_NEEDS: ${{ toJSON(needs) }}
      run: python3 scripts/ci_required_aggregate.py
