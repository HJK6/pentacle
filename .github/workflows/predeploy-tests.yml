name: Public checks
'on':
  push:
    branches:
    - main
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: System packages
      timeout-minutes: 5
      run: |
        missing=()
        for package in tmux; do
          command -v "$package" >/dev/null || missing+=("$package")
        done
        if ((${#missing[@]})); then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing[@]}"
        fi
    - name: Source integrity after setup
      run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
    - name: Supported npm tests
      run: python3 scripts/gate_env.py run --profile pentacle --workspace "${RUNNER_TEMP}/gate-env/${GITHUB_JOB}" --evidence-dir
        "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/npm" --target npm-test --spec ci-public-checks --series "ci-${GITHUB_RUN_ID}-npm"
        --purpose acceptance --attempt-manifest "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/attempt-manifest.json"
    - name: Client core tests and type contracts
      run: npm --prefix pentacle-chat-core test
    - run: python3 scripts/test_check_public_residue.py
    - run: python3 scripts/check_public_residue.py
    - name: Bounded dashboard dependency
      working-directory: vendor/dashboard-library
      run: |
        npm run build
        npm run check:dist
        npm test
    - name: Required CI controls
      run: |
        python3 -m pip install PyYAML==6.0.3 pytest==9.0.3
        python3 scripts/test_ci_required_aggregate.py
    - name: Source integrity at gate end
      run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
      if: ${{ always() }}
    - name: Retain gate summaries
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: gate-summaries-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/attempt-manifest.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/**/test-attempts.v1.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/**/attempts/**/*.json
    - name: Retain failed gate evidence
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: supported-gates-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: ${{ runner.temp }}/gate-evidence/${{ github.job }}/**
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: System packages
      timeout-minutes: 5
      run: |
        missing=()
        for package in tmux lsof ffmpeg; do
          command -v "$package" >/dev/null || missing+=("$package")
        done
        if ((${#missing[@]})); then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing[@]}"
        fi
    - name: Source integrity after setup
      run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
    - name: Web mode E2E gate
      run: python3 scripts/gate_env.py run --profile pentacle --workspace "${RUNNER_TEMP}/gate-env/${GITHUB_JOB}" --evidence-dir
        "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/web" --target web-gate --spec ci-public-checks --series "ci-${GITHUB_RUN_ID}-web"
        --purpose acceptance --attempt-manifest "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/attempt-manifest.json"
    - name: Source integrity at gate end
      run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
      if: ${{ always() }}
    - name: Retain gate summaries
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: gate-summaries-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/attempt-manifest.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/**/test-attempts.v1.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/**/attempts/**/*.json
    - name: Retain failed gate evidence
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: supported-gates-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: ${{ runner.temp }}/gate-evidence/${{ github.job }}/**
  daemon-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: System packages
      timeout-minutes: 5
      run: |
        missing=()
        for package in tmux lsof zsh ffmpeg; do
          command -v "$package" >/dev/null || missing+=("$package")
        done
        if ((${#missing[@]})); then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing[@]}"
        fi
    - name: Require qualified tmux 3.4
      run: |
        version="$(tmux -V)"
        echo "$version"
        if [ "$version" != "tmux 3.4" ]; then
          echo "::error::Daemon close-anchor controls require qualified tmux 3.4."
          exit 1
        fi
        tmux_socket_dir="$(mktemp -d)"
        cleanup_tmux() {
          tmux -S "$tmux_socket_dir/server" kill-server >/dev/null 2>&1 || true
          rm -f "$tmux_socket_dir/server"
          rmdir "$tmux_socket_dir"
        }
        trap cleanup_tmux EXIT
        tmux -S "$tmux_socket_dir/server" -f /dev/null new-session -d -s close-ci 'exec sleep 60'
        server_version="$(tmux -S "$tmux_socket_dir/server" display-message -p '#{version}')"
        echo "tmux server $server_version"
        if [ "$server_version" != "3.4" ]; then
          echo "::error::Daemon close-anchor controls require server version 3.4."
          exit 1
        fi
    - name: Source integrity after setup
      run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
    - name: Daemon unit partition
      run: |
        umask 077
        python3 scripts/gate_env.py run --profile pentacle --workspace "${RUNNER_TEMP}/gate-env/${GITHUB_JOB}" --evidence-dir "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/daemon" --target v2-unit-ci-shard --shard-index "${{ matrix.shard }}" --shard-count 6 --spec ci-public-checks --series "ci-${GITHUB_RUN_ID}-daemon-unit-${{ matrix.shard }}" --purpose acceptance --attempt-manifest "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/attempt-manifest.json"
    - name: Source integrity at gate end
      run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
      if: ${{ always() }}
    - name: Retain gate summaries
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/attempt-manifest.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/**/test-attempts.v1.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/**/attempts/**/*.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/daemon/gate/v2-unit-evidence.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/daemon/gate/unit.junit.xml
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/daemon/gate/unit.progress.jsonl
    - name: Retain failed gate evidence
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: supported-gates-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: ${{ runner.temp }}/gate-evidence/${{ github.job }}/**
  daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [daemon-unit]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: System packages
      timeout-minutes: 5
      run: |
        missing=()
        for package in tmux lsof; do
          command -v "$package" >/dev/null || missing+=("$package")
        done
        if ((${#missing[@]})); then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing[@]}"
        fi
    - name: Require qualified tmux 3.4
      run: |
        version="$(tmux -V)"
        echo "$version"
        if [ "$version" != "tmux 3.4" ]; then
          echo "::error::Daemon close-anchor controls require qualified tmux 3.4."
          exit 1
        fi
        tmux_socket_dir="$(mktemp -d)"
        cleanup_tmux() {
          tmux -S "$tmux_socket_dir/server" kill-server >/dev/null 2>&1 || true
          rm -f "$tmux_socket_dir/server"
          rmdir "$tmux_socket_dir"
        }
        trap cleanup_tmux EXIT
        tmux -S "$tmux_socket_dir/server" -f /dev/null new-session -d -s close-ci 'exec sleep 60'
        server_version="$(tmux -S "$tmux_socket_dir/server" display-message -p '#{version}')"
        echo "tmux server $server_version"
        if [ "$server_version" != "3.4" ]; then
          echo "::error::Daemon close-anchor controls require server version 3.4."
          exit 1
        fi
    - name: Source integrity after setup
      run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
    - name: Daemon smoke once
      run: |
        umask 077
        python3 scripts/gate_env.py run --profile pentacle --workspace "${RUNNER_TEMP}/gate-env/${GITHUB_JOB}" --evidence-dir "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/smoke" --target v2-smoke --spec ci-public-checks --series "ci-${GITHUB_RUN_ID}-daemon-smoke" --purpose acceptance --attempt-manifest "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/attempt-manifest.json"
    - name: Source integrity at gate end
      run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
      if: ${{ always() }}
    - name: Retain gate summaries
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/attempt-manifest.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/**/test-attempts.v1.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/**/attempts/**/*.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/smoke/gate/v2-smoke-evidence.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/smoke/gate/smoke.junit.xml
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/smoke/gate/smoke.progress.jsonl
    - name: Retain failed gate evidence
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: supported-gates-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: ${{ runner.temp }}/gate-evidence/${{ github.job }}/**
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Stable release manifest
      env:
        RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        python3 tools/release_manifest.py verify --ref HEAD --base "$RELEASE_BASE"
        python3 -m unittest discover -s tools/pentacle/tests
    - name: System packages
      timeout-minutes: 5
      run: |
        missing=()
        for package in tmux; do
          command -v "$package" >/dev/null || missing+=("$package")
        done
        command -v ffprobe >/dev/null || missing+=(ffmpeg)
        if ((${#missing[@]})); then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing[@]}"
        fi
    - name: Installed doctor and exact upgrade checklist
      run: |
        python3 tools/pentacle/tests/checklist_journey.py install --evidence "${RUNNER_TEMP}/shareability-install"
        python3 tools/pentacle/tests/checklist_journey.py rehearsal --evidence "${RUNNER_TEMP}/shareability-checklist"
    - name: Retain installation journey evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: shareability-journeys-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: ${{ runner.temp }}/shareability-*
    - name: Source integrity after setup
      run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
    - name: Portable microphone contracts
      run: |
        python3 -m pip install pytest==8.4.2 numpy==2.5.3 scipy==1.18.1
        PYTHONPATH=mic-server python3 -m pytest mic-server/test
    - name: CLI checks
      run: |
        umask 077
        python3 scripts/gate_env.py run --profile pentacle --workspace "${RUNNER_TEMP}/gate-env/${GITHUB_JOB}" --evidence-dir "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/cli" --target cli-pytest --select tests --spec ci-public-checks --series "ci-${GITHUB_RUN_ID}-cli" --purpose acceptance --attempt-manifest "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/attempt-manifest.json"
    - name: Shared checks
      run: |
        umask 077
        python3 scripts/gate_env.py run --profile pentacle --workspace "${RUNNER_TEMP}/gate-env/${GITHUB_JOB}" --evidence-dir "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/shared" --target shared-pytest --select tests --spec ci-public-checks --series "ci-${GITHUB_RUN_ID}-shared" --purpose acceptance --attempt-manifest "${RUNNER_TEMP}/gate-evidence/${GITHUB_JOB}/attempt-manifest.json"
    - name: Source integrity at gate end
      run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
      if: ${{ always() }}
    - name: Retain gate summaries
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: gate-summaries-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/attempt-manifest.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/**/test-attempts.v1.json
          ${{ runner.temp }}/gate-evidence/${{ github.job }}/**/attempts/**/*.json
    - name: Retain failed gate evidence
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: supported-gates-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: ${{ runner.temp }}/gate-evidence/${{ github.job }}/**
  checks:
    needs:
    - frontend
    - web
    - daemon-unit
    - daemon
    - contracts
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Require every partition to succeed
      env:
        CI_REQUIRED_NEEDS: ${{ toJSON(needs) }}
      run: python3 scripts/ci_required_aggregate.py
