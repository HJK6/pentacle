name: Public checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: System packages
        timeout-minutes: 10
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo apt-get "${apt_opts[@]}" update && sudo apt-get "${apt_opts[@]}" install -y tmux lsof zsh ffmpeg; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in 15 s"
            sleep 15
          done
          exit 1
      - run: npm ci
      - run: npm run prestart
      - run: npm test
      - run: python3 scripts/test_check_public_residue.py
      - run: python3 scripts/check_public_residue.py
      - name: Portable microphone contracts
        run: |
          python3 -m pip install pytest==8.4.2 numpy==2.5.3 scipy==1.18.1
          PYTHONPATH=mic-server python3 -m pytest mic-server/test
      - name: Bounded dashboard dependency
        working-directory: vendor/dashboard-library
        run: |
          npm run build
          npm run check:dist
          npm test
      - run: python -m pip install -r services/chat-stream-v2/requirements.txt -e services/agent-orch
      - name: Install Chrome for the web E2E gate
        timeout-minutes: 5
        run: |
          wget -q -O "${RUNNER_TEMP:-/tmp}/google-chrome-stable_current_amd64.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y "${RUNNER_TEMP:-/tmp}/google-chrome-stable_current_amd64.deb"
      - name: Source integrity after Chrome install
        run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
      - name: Web mode E2E gate
        run: |
          npm run build:web
          node test/e2e/web_gate.js
      - name: Daemon and CLI checks
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/services:${GITHUB_WORKSPACE}/services/agent-orch"
          python services/chat-stream-v2/tools/run_gate.py merge
          python -m pytest services/agent-orch/tests
      - name: Source integrity at gate end
        run: python3 services/chat-stream-v2/tools/source_integrity.py --root "${GITHUB_WORKSPACE}"
